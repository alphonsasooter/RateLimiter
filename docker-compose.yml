version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: rate_limiter_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rate_limiter_net

  rate-limiter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate_limiter_app
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - rate_limiter_net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: rate_limiter_dashboard
    ports:
      - "3000:80"
    depends_on:
      - rate-limiter
    networks:
      - rate_limiter_net

networks:
  rate_limiter_net:
    driver: bridge

volumes:
  redis_data: